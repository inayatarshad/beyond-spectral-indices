[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsi"
version = "0.1.0"
description = "Beyond spectral indices: when and why deep models beat NBR/NDVI for burn-scar and forest mapping"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "h5py>=3.9",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "shap>=0.44",
    "torch>=2.1",
    "segmentation-models-pytorch>=0.3.3",
    "captum>=0.7",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
forest = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "odc-stac>=0.3.9",
    "rioxarray>=0.15",
    "xarray>=2023.1",
    "dask>=2023.1",
]

[tool.setuptools.packages.find]
where = ["src"]
