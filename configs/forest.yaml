# Tree-cover mapping: Sentinel-2 L2A 2021 composites, ESA WorldCover 2021 (v200) labels.
# WorldCover is itself derived from Sentinel data, so the test labels are not
# independent ground truth; see the limitations section of the paper.
task: forest
use_pre: false
data_dir: data/forest
run_dir: runs/forest
seed: 0
pixel_size_m: 10

source:
  name: planetary_computer
  year: 2021                # before the Jan-2022 L2A radiometric offset change
  months: [6, 7, 8, 9]      # leaf-on season (swap to [12, 1, 2, 3] for southern AOIs if needed)
  max_cloud: 30
  chip_size: 256
  split_fractions: {train: 0.6, val: 0.2, test: 0.2}   # contiguous west-to-east column blocks per AOI
  # name: [min_lon, min_lat, max_lon, max_lat]; ~0.4 x 0.3 deg each, chosen to cover distinct biomes and NDVI confounders
  aois:
    brittany_paimpont:  [-2.41, 47.88, -2.01, 48.18]    # temperate broadleaf, hedgerow farmland
    murree_galiyat:     [73.22, 33.77, 73.62, 34.07]    # Himalayan conifer, terraces
    rondonia_frontier:  [-63.16, -10.11, -62.76, -9.81] # tropical forest vs pasture
    riau_plantations:   [101.29, 0.34, 101.69, 0.64]    # oil palm / acacia plantations
    dalarna_boreal:     [14.95, 60.9, 15.35, 61.2]      # boreal conifer, clear-cuts, bogs
    mau_forest:         [35.54, -0.66, 35.94, -0.36]    # montane forest vs tea and cropland
    sacramento_valley:  [-122.06, 38.89, -121.66, 39.19]# irrigated crops (high NDVI, no trees)

index:
  name: ndvi
  literature_threshold: 0.50

unet:
  encoder: resnet18
  encoder_weights: imagenet
  epochs: 30
  batch_size: 8
  lr: 0.001
  num_workers: 0
  crop_size: 128            # random training crops; evaluation uses full chips (CPU budget)

lgbm:
  pixels_per_chip: 2000
  num_leaves: 63
  n_estimators: 400
  learning_rate: 0.05

explain:
  n_chips: 60
  ig_steps: 32
  context_pixels_per_chip: 16
  shap_pixels: 5000
