# GPU profile of burn.yaml for 5-fold cross-validation (scripts/run_cv.py, notebooks/run_colab.ipynb).
task: burn
use_pre: true               # stack pre-fire bands so dNBR and the models see the same information
data_dir: data/burn
run_dir: runs/burn
seed: 0
pixel_size_m: 20          # CaBuAr ships all bands resampled to the 20 m grid

source:
  name: cabuar
  hf_repo: DarthReca/california_burned_areas
  hf_file: raw/patched/512x512.hdf5
  local_file: data/raw/cabuar_512x512.hdf5   # used instead of downloading when present
  chip_size: 256            # 512x512 patches are cut into 4 chips
  folds: {train: [0, 1, 2], val: [3], test: [4]}

index:
  name: dnbr                # nbr on the post image alone if use_pre is false
  literature_threshold: 0.10   # USGS lower bound of "low severity"

unet:
  encoder: resnet18
  encoder_weights: imagenet   # first conv is adapted to the channel count by smp
  epochs: 50
  patience: 12              # early stopping on validation IoU
  batch_size: 16
  lr: 0.001
  num_workers: 2
  crop_size: null           # full 256 px chips on GPU (more spatial context than CPU crops)

lgbm:
  pixels_per_chip: 2000
  num_leaves: 63
  n_estimators: 400
  learning_rate: 0.05

explain:
  n_chips: 60               # test chips used for attribution
  ig_steps: 32
  context_pixels_per_chip: 16
  shap_pixels: 5000         # TreeSHAP sample for the LightGBM rungs
